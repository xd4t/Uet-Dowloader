  #state { margin-top: 8px; font-size: 12px; }

</style>
</head>
<body>
  <label>Bật chọn file tải <input type="checkbox" id="toggle"></label>
  <p>Mở trang Files của môn học, bật công tắc, rồi tick các file cần tải.</p>
  <div id="state"></div>
  <div class="author">Made by <b>XD4T</b></div>
